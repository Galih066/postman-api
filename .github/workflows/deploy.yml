name: Deploy to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy build files to server
        run: |
          rsync -avz --delete dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/postman-api/dist/
          rsync -avz package.json package-lock.json ecosystem.config.cjs ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/postman-api/

      - name: Install production dependencies & reload app
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'EOF'
            set -e
            cd /opt/postman-api

            # .env is not part of the deploy; it must exist on the server (only variable names are printed)
            if [ ! -f .env ]; then
              echo "ERROR: /opt/postman-api/.env not found"; exit 1
            fi
            NODE_APP_VAL=$(grep -E '^NODE_APP=' .env | cut -d= -f2 | tr -d '[:space:]"')
            DB_VAR=$([ "$NODE_APP_VAL" = "production" ] && echo MONGO_URI_PRD || echo MONGO_URI)
            for VAR in SECRET_KEY "$DB_VAR"; do
              grep -qE "^$VAR=.+" .env || { echo "ERROR: $VAR is missing in .env (NODE_APP=${NODE_APP_VAL:-<unset>})"; exit 1; }
            done

            npm ci --omit=dev

            # delete + start (not reload) so no stale env vars from a previous start are kept by pm2
            # flush first so the health check only shows logs from this run
            pm2 flush postman-api > /dev/null 2>&1 || true
            pm2 delete postman-api > /dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs
            pm2 save
          EOF

      - name: Health check
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -s' <<'EOF'
            cd /opt/postman-api
            PORT=$(grep -E '^PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '[:space:]')
            PORT=${PORT:-3000}
            sleep 5
            for i in $(seq 1 10); do
              PID=$(pm2 pid postman-api)
              # The port must be held by OUR pm2 process (not a stale process from another user/folder)
              if [ -n "$PID" ] && [ "$PID" != "0" ] \
                && ss -ltnp | grep ":$PORT " | grep -q "pid=$PID," \
                && curl -fsS "http://localhost:$PORT/" > /dev/null; then
                echo "Health check OK: pid $PID is serving port $PORT"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed: port $PORT is not served by pm2 process postman-api"
            ss -ltnp | grep ":$PORT " || echo "(port $PORT held by another user's process, or not listening)"
            pm2 logs postman-api --lines 40 --nostream
            exit 1
          EOF
